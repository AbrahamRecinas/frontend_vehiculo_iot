<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Grúa RC IoT 12 Funciones">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#132440"/>
    </linearGradient>
    <linearGradient id="boom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="14" fill="url(#bg)"/>
  <!-- Cuadrícula técnica sutil -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.35">
    <line x1="0" y1="148" x2="320" y2="148"/>
    <line x1="40" y1="0" x2="40" y2="180"/>
    <line x1="160" y1="0" x2="160" y2="180"/>
    <line x1="280" y1="0" x2="280" y2="180"/>
  </g>
  <!-- Ondas IoT / WiFi ESP8266 -->
  <g fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round">
    <path d="M250 42 A18 18 0 0 1 274 42" opacity="0.5"/>
    <path d="M255 49 A11 11 0 0 1 269 49" opacity="0.8"/>
    <circle cx="262" cy="56" r="2.5" fill="#06b6d4"/>
  </g>
  <!-- Brazo articulado y pala -->
  <path d="M128 96 L186 46 L236 62" fill="none" stroke="url(#boom)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 96 L186 46 L236 62" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>
  <!-- Cable y pala / gancho -->
  <line x1="236" y1="62" x2="236" y2="96" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M224 96 L248 96 L254 116 C244 122 228 122 218 116 Z" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="186" cy="46" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="236" cy="62" r="4" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <!-- Cabina y cuerpo rotatorio -->
  <rect x="76" y="76" width="68" height="44" rx="8" fill="url(#boom)"/>
  <path d="M108 82 L136 82 L140 100 L108 100 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="82" y="84" width="18" height="10" rx="2" fill="#0f172a" opacity="0.55"/>
  <circle cx="88" cy="112" r="3" fill="#22c55e"/>
  <!-- Chasis y orugas -->
  <rect x="64" y="122" width="112" height="24" rx="12" fill="#1e293b" stroke="url(#accent)" stroke-width="2.5"/>
  <circle cx="82" cy="134" r="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="106" cy="134" r="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="130" cy="134" r="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="158" cy="134" r="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <!-- Etiqueta técnica -->
  <text x="16" y="26" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MOD-GRUA-12F · ESP8266</text>
  <text x="16" y="167" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">12 canales físicos · Telemetría WSS</text>
</svg>
